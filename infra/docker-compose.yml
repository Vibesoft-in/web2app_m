services:
  # ─── PHP-FPM (Laravel) ───────────────────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: wia_php
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../backend:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
    networks:
      - wia_net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Queue worker (Horizon) ───────────────────────────────────────────────────
  horizon:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: wia_horizon
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - ../backend:/var/www
    networks:
      - wia_net
    depends_on:
      - php
      - redis

  # ─── Scheduler ────────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: wia_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ../backend:/var/www
    networks:
      - wia_net
    depends_on:
      - php

  # ─── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: wia_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../backend:/var/www:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wia_net
    depends_on:
      - php

  # ─── MySQL 8 ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: wia_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret_root}
      MYSQL_DATABASE: ${DB_DATABASE:-webintoapp}
      MYSQL_USER: ${DB_USERNAME:-wia}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3307:3306"       # 3307 on host so it doesn't clash with local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - wia_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret_root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: wia_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret_redis}
    ports:
      - "6380:6379"       # 6380 on host
    volumes:
      - redis_data:/data
    networks:
      - wia_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret_redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Mailpit (dev email) ──────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: wia_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"       # web UI
      - "1025:1025"       # SMTP
    networks:
      - wia_net

networks:
  wia_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
