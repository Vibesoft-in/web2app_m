; Production-safe PHP settings
upload_max_filesize = 10M
post_max_size       = 12M
memory_limit        = 256M
max_execution_time  = 60
expose_php          = Off
display_errors      = Off
log_errors          = On

; OPcache (leave off for local to allow hot-reload, enable in staging/prod)
; opcache.enable = 1
; opcache.memory_consumption = 128
