[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# ------------------------------------------------------------------------------
# PHP-FPM Master Process
# ------------------------------------------------------------------------------
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ------------------------------------------------------------------------------
# Laravel Horizon (Push Notifications, Webhooks, General Queues)
# ------------------------------------------------------------------------------
[program:horizon]
process_name=%(program_name)s
command=php /var/www/artisan horizon
autostart=true
autorestart=true
user=appify
redirect_stderr=true
stdout_logfile=/var/log/supervisor/horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=3600
priority=10

# ------------------------------------------------------------------------------
# Dedicated Isolated Android Build Worker (Long timeout: 30 minutes, 1 try)
# ------------------------------------------------------------------------------
[program:build-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --queue=builds --timeout=1800 --tries=1 --memory=1024
autostart=true
autorestart=true
user=appify
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/build-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=1800
priority=15

# ------------------------------------------------------------------------------
# Laravel Task Scheduler (Hourly HealthChecks, Daily Backups, Rollup)
# ------------------------------------------------------------------------------
[program:cron-scheduler]
process_name=%(program_name)s
command=/bin/sh -c "while [ true ]; do (php /var/www/artisan schedule:run --no-interaction &); sleep 60; done"
autostart=true
autorestart=true
user=appify
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=20
