server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    # Security: hide server version
    server_tokens off;

    # Block sensitive paths — must never be web-accessible
    location ~ /\.(git|env|htaccess) { deny all; return 404; }
    location ~ ^/(storage|vendor|bootstrap/cache) { deny all; return 404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts for long-running API calls (connector verify etc.)
        fastcgi_read_timeout 60;
        fastcgi_send_timeout 60;
    }

    # Static asset caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security headers (app also sets these via middleware, belt-and-suspenders)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
