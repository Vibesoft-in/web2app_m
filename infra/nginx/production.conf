# ==============================================================================
# Production Nginx Configuration for Appify White-Label Platform
# ==============================================================================

# Rate limiting zones (protects against brute-force and DDoS)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=3r/m;

# SSL Session Cache configuration
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# Modern TLS ciphers (TLS 1.2 and 1.3 only)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

# Upstream PHP-FPM cluster
upstream php_backend {
    server php:9000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Upstream Next.js Dashboard
upstream dashboard_backend {
    server dashboard:3000;
    keepalive 16;
}

# ------------------------------------------------------------------------------
# HTTP -> HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME Challenge for Let's Encrypt renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# API Backend Server (api.appify.dev)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.appify.dev;

    root /var/www/public;
    index index.php;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/api.appify.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.appify.dev/privkey.pem;

    # Security: Server tokens & Version cloaking
    server_tokens off;

    # Maximum payload size (Images & Assets)
    client_max_body_size 12M;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # ── Security Headers (Mandatory per docs/04 Part A §7) ──────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self';" always;

    # ── Strict Path Restrictions (Prevent Leaks) ──────────────────────────────
    # Block git, env, and dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block sensitive application directories
    location ~ ^/(storage|vendor|bootstrap/cache|node_modules|tests)/ {
        deny all;
        return 404;
    }

    # Block backup / sql / config dump extensions
    location ~* \.(sql|bak|inc|old|orig|dist|env|log)$ {
        deny all;
        return 404;
    }

    # ── Rate Limited Endpoints ────────────────────────────────────────────────
    location ~* ^/api/auth/register {
        limit_req zone=auth_limit burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/v1/auth/otp/ {
        limit_req zone=otp_limit burst=2 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── General API Routing ───────────────────────────────────────────────────
    location / {
        limit_req zone=api_general burst=30 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── FastCGI PHP Handler ───────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Keep alive & buffer tuning
        fastcgi_keep_conn on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;

        # Strip internal headers
        fastcgi_hide_header X-Powered-By;
    }

    # ── Health Endpoint (No Log spam) ─────────────────────────────────────────
    location = /health {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # ── Static File Caching ───────────────────────────────────────────────────
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Logging
    access_log /var/log/nginx/api_access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/api_error.log warn;
}

# ------------------------------------------------------------------------------
# Dashboard Frontend Server (app.appify.dev)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.appify.dev;

    ssl_certificate /etc/letsencrypt/live/app.appify.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.appify.dev/privkey.pem;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.appify.dev;" always;

    location / {
        proxy_pass http://dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
