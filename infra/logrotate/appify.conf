# ==============================================================================
# Logrotate configuration for Appify Production Stack
# Path on host: /etc/logrotate.d/appify
# ==============================================================================

# Laravel application logs
/var/www/storage/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    copytruncate
    create 0640 appify appify
}

# Nginx access & error logs
/var/log/nginx/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 nginx adm
    sharedscripts
    postrotate
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 $(cat /var/run/nginx.pid)
        fi
    endscript
}

# Supervisor & Horizon process logs
/var/log/supervisor/*.log {
    weekly
    missingok
    rotate 8
    compress
    delaycompress
    notifempty
    copytruncate
    create 0640 root root
}
