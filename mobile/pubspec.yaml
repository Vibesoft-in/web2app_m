name: webintoapp_mobile
description: "White-label Flutter mobile app engine for WebIntoApp SaaS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.1

  # Routing
  go_router: ^13.2.0

  # Secure Storage & Cache
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^1.1.0

  # UI & Media
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.1.0

  # Webview
  webview_flutter: ^4.7.0

  # Push Notifications
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
